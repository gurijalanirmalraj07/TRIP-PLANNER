<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Trip Planner</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="overlay">
  <div class="container">
    <h1>🌍 Smart Trip Planner</h1>

    <form id="tripForm">
      <label>Select Destination:</label>
      <select id="destination" required>
        <option value="">-- Choose Destination --</option>
        <option value="Goa">Goa</option>
        <option value="Manali">Manali</option>
        <option value="Ladakh">Ladakh</option>
        <option value="Khasi">Khasi Hills</option>
        <option value="Araku">Araku</option>
        <option value="Pondicherry">Pondicherry</option>
      </select>

      <label>Number of Days:</label>
      <input type="number" id="days" min="1" required>

      <label>Number of People:</label>
      <input type="number" id="people" min="1" required>

      <label>Your Budget (₹):</label>
      <input type="number" id="budget" min="0" required>

      <button type="submit">Plan My Trip ✈️</button>
    </form>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
